{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-lg panel p-6 md:p-9">
    <p class="eyebrow">Account recovery</p><h1 class="mt-2 text-2xl font-extrabold">Reset your password</h1><p class="mt-2 text-sm leading-6 text-[#647773]">Enter the email address on your account. If it is registered, we’ll send a one-time reset link that expires in one hour.</p>
    <form action="{{ url_for('forgot_password') }}" method="POST" class="mt-6 space-y-4"><label class="block text-xs font-bold">Email address<input class="field mt-1" type="email" name="email" autocomplete="email" required></label><button class="button-primary w-full py-3" type="submit">Email reset link</button></form>
    <p class="mt-5 text-center text-xs text-[#647773]"><a href="{{ url_for('index') }}" class="font-bold text-[#176b58] underline underline-offset-2">Return to sign in</a></p>
</div>
{% endblock %}
