{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-lg panel p-6 md:p-9">
    <p class="eyebrow">Account recovery</p><h1 class="mt-2 text-2xl font-extrabold">Choose a new password</h1><p class="mt-2 text-sm text-[#647773]">Use at least 8 characters. This reset link can only be used once.</p>
    <form action="{{ url_for('reset_password', token=token) }}" method="POST" class="mt-6 space-y-4">
        <label class="block text-xs font-bold">New password<span class="relative mt-1 block"><input id="reset-password" class="field pr-12" type="password" name="password" minlength="8" autocomplete="new-password" required><button type="button" data-password-toggle="reset-password" aria-label="Show password" aria-pressed="false" class="absolute right-2 top-1/2 -translate-y-1/2 rounded p-2 text-[#647773] hover:bg-[#f5f7f3]"><svg data-eye-open viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg data-eye-closed viewBox="0 0 24 24" class="hidden h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14 14 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg></button></span></label>
        <label class="block text-xs font-bold">Confirm new password<input class="field mt-1" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label>
        <button class="button-primary w-full py-3" type="submit">Update password</button>
    </form>
</div>
{% endblock %}
